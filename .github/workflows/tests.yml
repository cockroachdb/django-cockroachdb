name: Django test suite

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This job aggregates all matrix results and is used for a GitHub required status check.
  test_results:
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    name: Test Results
    needs: [test]
    steps:
      - run: |
          result="${{ needs.test.result }}"
          if [[ $result == "success" || $result == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - crdb-version: v24.3.36
          - crdb-version: v24.3.36
            use_psycopg2: psycopg2
          - crdb-version: v24.3.36
            use_server_side_binding: server_side_binding
          - crdb-version: v25.2.23
          - crdb-version: v25.2.23
            use_psycopg2: psycopg2
          - crdb-version: v25.2.23
            use_server_side_binding: server_side_binding
          - crdb-version: v25.4.16
          - crdb-version: v25.4.16
            use_psycopg2: psycopg2
          - crdb-version: v25.4.16
            use_server_side_binding: server_side_binding
          - crdb-version: v26.2.6
          - crdb-version: v26.2.6
            use_psycopg2: psycopg2
          - crdb-version: v26.2.6
            use_server_side_binding: server_side_binding
          - crdb-version: v26.3.1
          - crdb-version: v26.3.1
            use_psycopg2: psycopg2
          - crdb-version: v26.3.1
            use_server_side_binding: server_side_binding
          # Uncomment to enable testing of CockroachDB nightly.
          #- crdb-version: LATEST
          #- crdb-version: LATEST
          #  use_psycopg2: psycopg2
          #- crdb-version: LATEST
          #  use_server_side_binding: server_side_binding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install system packages for Django's Python test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install binutils gdal-bin
      - name: Run build.sh
        run: bash django-test-suite/build.sh ${{ matrix.crdb-version }}
        env:
          USE_PSYCOPG2: ${{ matrix.use_psycopg2 }}
          USE_SERVER_SIDE_BINDING: ${{ matrix.use_server_side_binding }}
